# First-party checkout: shallow fetch of the exact triggering commit with the
# job token over HTTPS. This is the routine test.yml was born with, moved here
# so both workflows share it -- CI stays free of third-party actions (see
# docs/supply-chain.md). Local `uses: ./.github/actions/checkout` loads from
# this repo's own commit, the same trust level as an inline run step.
name: "Checkout (manual, no third-party actions)"
description: "git init + fetch --depth 1 GITHUB_SHA + detach at FETCH_HEAD"
runs:
  using: composite
  steps:
    - name: "Checkout"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git config --global advice.defaultBranchName false
        git init
        git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        echo "::add-mask::${GITHUB_TOKEN}"
        CRED=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
        echo "::add-mask::${CRED}"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${CRED}" \
          fetch --depth 1 --no-tags origin "${GITHUB_SHA}"
        git checkout --detach FETCH_HEAD
