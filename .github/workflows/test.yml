name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUN_VERSION: "1.4.2"
  # Point config resolution at the minimal example config so tests
  # that fall back to filesystem config discovery have a deterministic target.
  HOTDOG_CONFIG_DIR: "./examples/minimal-config/config"

jobs:
  test:
    name: "bun test"
    runs-on: ubuntu-latest
    steps:
      # Bootstrap checkout, intentionally inline: the workspace starts empty
      # and `uses: .` resolves from the workspace, so a local action can never
      # fetch the repo it lives in. Keep in sync with .github/workflows/publish.yml.
      - name: "Checkout"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global advice.defaultBranchName false
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "::add-mask::${GITHUB_TOKEN}"
          CRED=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::${CRED}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${CRED}" \
            fetch --depth 1 --no-tags origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: "Install bun"
        run: examples/docker/bun-install.sh "$BUN_VERSION"

      - name: "Run tests"
        run: bun run loud-test

      - name: "Run tests with coverage"
        run: bun run coverage

      - name: "Run type check"
        run: bun i --no-save && bun run check

  macos:
    name: "bun test + seatbelt fence (macOS)"
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Same bootstrap checkout as the linux job (see note there).
      - name: "Checkout"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global advice.defaultBranchName false
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "::add-mask::${GITHUB_TOKEN}"
          CRED=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::${CRED}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${CRED}" \
            fetch --depth 1 --no-tags origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # No third-party setup action: same doctrine as bun-install.sh (same release host, own installer)
      # bun-install.sh itself is linux-only (wget, /proc/cpuinfo), so this is its darwin sibling.
      - name: "Install bun"
        run: |
          case "$(uname -m)" in
            arm64)  BUN_ARCH=darwin-aarch64 ;;
            x86_64) BUN_ARCH=darwin-x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-${BUN_ARCH}.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -q -j -o /tmp/bun.zip "bun-${BUN_ARCH}/bun" -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The fence posture on Apple hardware is this job's reason to exist.
      # macOS 26+ hosted images may ship without working seatbelt mediation: that
      # is a property of the runner, not of our code, so an unavailable fence
      # degrades LOUDLY (warning annotation: coverage SKIPPED, not passed) with
      # diagnostics -- runSeatbeltProbe swallows the legs' stderr, CI needs a why.
      # Where the probe passes, the hard-fail stands unchanged.
      - name: "Seatbelt posture probe"
        id: seatbelt_probe
        run: |
          set +e
          bun bin/hotdog info | tee /tmp/hotdog-info.txt
          if grep -q "fence: seatbelt" /tmp/hotdog-info.txt; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          POSTURE="$(grep -m1 'Tools Exec' /tmp/hotdog-info.txt | sed 's/^[[:space:]]*//')"
          [ -n "$POSTURE" ] || POSTURE="(no 'Tools Exec' line in info output)"
          echo "::warning::seatbelt fence unavailable on this macOS runner (probe failed -- mediation absent or shim gone). Fence coverage SKIPPED, not passed. Posture line: $POSTURE"
          echo "::group::seatbelt diagnostics"
          sw_vers 2>&1
          if [ -f /usr/bin/sandbox-exec ]; then
            ls -la /usr/bin/sandbox-exec
            echo "--- allow-default exec: /usr/bin/true ---"
            /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true 2>&1
            echo "exit=$?"
            echo "--- deny-default read: /bin/cat temp file (exit 0 means denies do NOT bite) ---"
            TMPF="$(mktemp)"
            printf 'seatbelt-diag-token\n' > "$TMPF"
            /usr/bin/sandbox-exec -p '(version 1)(deny default)' /bin/cat "$TMPF" 2>&1
            echo "exit=$?"
            rm -f "$TMPF"
          else
            echo "sandbox-exec shim absent"
          fi
          echo "::endgroup::"
          exit 0

      # The original doctrine's guard, now only on probe-healthy runners. It
      # re-greps the capture the probe step already matched, so it exists to
      # catch a corrupted/emptied /tmp capture between steps, nothing more.
      - name: "Fence posture: expect seatbelt (probe-healthy runner)"
        if: steps.seatbelt_probe.outputs.available == 'true'
        run: |
          grep -q "fence: seatbelt" /tmp/hotdog-info.txt || {
            echo "::error::seatbelt probe passed but the info capture lost the 'fence: seatbelt' line"
            exit 1
          }

      - name: "Run tests"
        run: bun run loud-test
        
      - name: "Seatbelt live jail suite"
        if: steps.seatbelt_probe.outputs.available == 'true'
        run: bun test tests/utils/exec-plan-seatbelt-live.test.ts

      # when a jail test fails, the sandboxd denials are the diagnosis.
      - name: "Dump sandboxd denials (on failure)"
        if: failure()
        run: |
          log show --last 15m \
            --predicate 'process == "sandboxd" or sender == "Sandbox"' 2>/dev/null \
            | grep -E "deny|violation" | tail -300 || echo "no sandboxd denials captured"

    # Coverage and tsc stay on the linux job: platform-independent