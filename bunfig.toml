telemetry = false

[test]
preload = ["./tests/setup.ts", "./tests/dom-helper/index.ts"]
# Eval fixtures intentionally ship broken/bait test files (e.g. kielbasa-2-008 conflicted repo)
# pty-tests lane: deterministic terminal-state tests over real PTYs (bun run test:pty),
# deliberately outside the unit loop -- ~10s budget + python3 pty host dep. No *.test.ts
# files exist there today; the ignore makes the exclusion explicit and future-proof.
pathIgnorePatterns = [
    "evals/series/**",
    "pty-tests/**",
    "experiments/**",
    "tmp/**",
    "secret-sauce/**",
]
coveragePathIgnorePatterns = [
    "**/*.test.ts",
    "tests/**",
    "evals/**",
    "experiments/**",
    "tmp/**",
    "secret-sauce/**",
]
coverageThreshold = 0.80
coverageSkipTestFiles = true
