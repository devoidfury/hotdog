telemetry = false

[test]
preload = ["./tests/setup.ts", "./tests/dom-helper/index.ts"]
# Eval fixtures intentionally ship broken/bait test files (e.g. kielbasa-2-008 conflicted repo)
pathIgnorePatterns = [
    "evals/series/**",
    "experiments/**",
    "tmp/**",
    "secret-sauce/**",
]
coveragePathIgnorePatterns = [
    "**/*.test.ts",
    "tests/**",
    "evals/**",
    "experiments/**",
    "tmp/**",
    "secret-sauce/**",
]
coverageThreshold = 0.80
coverageSkipTestFiles = true
