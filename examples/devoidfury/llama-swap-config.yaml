macros:
  llama-server: >
    llama-server
    --port ${PORT}
    --load-mode mlock
    --threads-http 2
    --threads 4
    --threads-batch 8
    --kv-unified
    --no-warmup
    --prio 3
    --flash-attn on
    --n-gpu-layers all
    --cors-origins localhost
  spec-ngram: >
    --spec-ngram-mod-n-match 28
    --spec-ngram-mod-n-min 48
    --spec-ngram-mod-n-max 64
  qwen-server: >
    ${llama-server}
    --jinja
    --chat-template-file /storage/templates/qwen-custom.jinja

apiKeys:
  - REDACTED_PUT-YOUR-KEY-HERE

healthCheckTimeout: 600

models:
  agent-a1-35b-moe:
    cmd: |
      ${llama-server}
      -m /storage/models/agents-a1/Agents-A1-F16.gguf
      --mmproj /storage/models/agents-a1/Agents-A1-mmproj.gguf
      --image-min-tokens 1024
      -b 1024
      -ub 1024
      --spec-type ngram-mod
      ${spec-ngram}
      -np 1
      --ctx-size 262144
      --checkpoint-min-step 2048
      --ctx-checkpoints 18
      --jinja
    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.85
          top_p: 0.95
          top_k: 20
          min_p: 0.00
          presence_penalty: 1.1
          repetition_penalty: 1.0
          chat_template_kwargs:
            enable_thinking: true
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      context: 262144
  dsv4:
    # Minimum context for max reasoning effort is 393216;
    # happens to just barely fit in memory on a headless server strix halo 128GB UMA.
    # KV cache will leak here if /tmp is pointed at memory; it's okay if this goes
    # to swap but make sure to have swap configured enabled, space for it on disk, and an ssd
    cmd: |
      /storage/opensrc/ds4/ds4-server
      --chdir /storage/opensrc/ds4
      --rocm
      -m gguf/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix.gguf
      --port ${PORT}
      --ctx 200000
      --power 100
      --kv-disk-dir /tmp/ds4-kv
      --kv-disk-space-mb 8192
    # --ctx 393216
    checkEndpoint: /v1/models
    capabilities:
      in:
        - text
      out:
        - text
      tools: true
      context: 200000
  laguna-s-2.1:
