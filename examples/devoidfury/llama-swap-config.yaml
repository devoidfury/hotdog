macros:
  models: /storage/models
  software: /storage/opensrc
  llama-cpp-core:
    --port ${PORT}
    --prio 3
    --cors-origins localhost
    --offline
  llama-cpp-shared-runtime:
    ${llama-cpp-core}
    --threads-http 8
    --threads 4
    --threads-batch 8
    --flash-attn on
    --n-gpu-layers all
    --no-warmup
    --jinja
  llama-server: >
    ${software}/llama.cpp/build/bin/llama-server
    ${llama-cpp-shared-runtime}
    --load-mode mlock
    --kv-unified
  # --device Vulkan0,ZenDNN,BLAS
  # --device ROCm0,ZenDNN,BLAS
  spec-ngram: >
    --spec-ngram-mod-n-match 28
    --spec-ngram-mod-n-min 48
    --spec-ngram-mod-n-max 64
  qwen-server: >
    ${llama-server}
    --chat-template-file /storage/templates/qwen-custom.jinja
  gufo:
    ${software}/gufo/build/release/gufo serve --port ${PORT}
  whisper-server:
    ${software}/whisper.cpp/build/bin/whisper-server
    --port ${PORT}

apiKeys:
  - "${env.LLAMA_SWAP_KEY}"

healthCheckTimeout: 600

