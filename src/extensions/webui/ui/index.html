<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hotdog</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Pre-paint theme application. Mirrors ui/theme-pref.ts: a stored
    // non-default palette lands on <html> BEFORE the first paint, so a
    // themed user never sees a hotdog flash; the module re-applies the same
    // value at boot (applyStoredTheme). Built-in ids only need the
    // data-theme tag (their block ships in styles.css); a CUSTOM id also
    // gets its saved palette written inline, exactly like the module does --
    // property names and hex values are re-validated here, garbage bytes can
    // never reach the style attribute. Pinned strings: storage keys
    // "hotdog-webui-theme" / "hotdog-webui-themes", default id "hotdog" = NO
    // data-theme attribute (an unknown stored id renders that same bare
    // :root look; the module normalizes it). Every access is swallowed:
    // localStorage can throw before the app even loads.
    try {
      var storedTheme = localStorage.getItem("hotdog-webui-theme");
      if (storedTheme && storedTheme !== "hotdog") {
        document.documentElement.setAttribute("data-theme", storedTheme);
        var customs = JSON.parse(localStorage.getItem("hotdog-webui-themes") || "[]");
        for (var ti = 0; ti < customs.length; ti++) {
          var pal = customs[ti] && customs[ti].id === storedTheme ? customs[ti].colors : null;
          if (!pal) continue;
          for (var tok in pal) {
            if (!/^--[a-z0-9-]+$/.test(tok) || !/^#[0-9a-fA-F]{6}$/.test(pal[tok])) continue;
            document.documentElement.style.setProperty(tok, pal[tok].toLowerCase());
          }
          // The four accent derivatives, same math as theme-pref's
          // accentDerivedTokens (0.86 / 0.72 scales, 0.12 / 0.25 washes).
          var hx = pal["--accent"], ac = hx && /^#[0-9a-fA-F]{6}$/.test(hx) ? parseInt(hx.slice(1), 16) : 0;
          if (ac) {
            var r = (ac >> 16) & 255, g = (ac >> 8) & 255, b = ac & 255;
            var sc = function (c, f) { return Math.round(Math.min(255, Math.max(0, c * f))); };
            var hex2 = function (n) { return ("0" + n.toString(16)).slice(-2); };
            document.documentElement.style.setProperty("--accent-hover", "#" + hex2(sc(r, 0.86)) + hex2(sc(g, 0.86)) + hex2(sc(b, 0.86)));
            document.documentElement.style.setProperty("--accent-active", "#" + hex2(sc(r, 0.72)) + hex2(sc(g, 0.72)) + hex2(sc(b, 0.72)));
            document.documentElement.style.setProperty("--accent-soft", "rgba(" + r + ", " + g + ", " + b + ", 0.12)");
            document.documentElement.style.setProperty("--accent-glow", "rgba(" + r + ", " + g + ", " + b + ", 0.25)");
          }
          // The status washes, when the palette carries retuned status
          // hues (theme-pref's statusDerivedTokens, same 0.12 alpha).
          for (var si = 0; si < 2; si++) {
            var base = si === 0 ? "--success" : "--error";
            var shx = pal[base];
            if (shx && /^#[0-9a-fA-F]{6}$/.test(shx)) {
              var sn = parseInt(shx.slice(1), 16);
              document.documentElement.style.setProperty(
                base + "-soft",
                "rgba(" + ((sn >> 16) & 255) + ", " + ((sn >> 8) & 255) + ", " + (sn & 255) + ", 0.12)"
              );
            }
          }
        }
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.tsx"></script>
</body>
</html>
